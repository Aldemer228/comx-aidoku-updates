name: Publish Com-X feed

on:
  push:
    paths:
      - "comx-feed.zip"
      - "comx-feed-v*.zip"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified Aidoku source list
        run: |
          python3 - <<'PY'
          import io
          import json
          from pathlib import Path
          from zipfile import ZipFile

          import re
          # Versioned archives avoid needing to overwrite an existing ZIP
          # through GitHub's browser upload screen.
          candidates = []
          for file in Path(".").glob("comx-feed-v*.zip"):
              matched = re.fullmatch(r"comx-feed-v([0-9]+)\.zip", file.name)
              if matched:
                  candidates.append((int(matched.group(1)), file))
          if candidates:
              requested_version, bundle = max(candidates)
          else:
              bundle = Path("comx-feed.zip")
              if not bundle.exists():
                  print("Upload comx-feed-vNN.zip to publish the source list.")
                  raise SystemExit(0)
              requested_version = None

          current = Path("index.min.json")
          if current.exists():
              previous = json.loads(current.read_text(encoding="utf-8"))
              previous_version = max(
                  (v.get("version", 0) for v in previous.get("sources", []) if v.get("id") == "ru.comx"),
                  default=0,
              )
          else:
              previous_version = 0

          with ZipFile(bundle) as archive:
              names = set(archive.namelist())
              if "index.min.json" not in names:
                  raise ValueError("Missing source index")
              index = json.loads(archive.read("index.min.json"))
              if index.get("name") != "Com-X Updates" or len(index.get("sources", [])) != 1:
                  raise ValueError("Unexpected source-list format")
              entry = index["sources"][0]
              if entry["id"] != "ru.comx":
                  raise ValueError("Unexpected source id")
              if requested_version is not None and entry["version"] != requested_version:
                  raise ValueError("Feed archive filename and source version mismatch")
              if entry["version"] < previous_version:
                  raise ValueError("Refusing to publish older version over existing public feed")
              expected = {
                  "index.min.json", "index.json", entry["iconURL"], entry["downloadURL"]
              }
              if names != expected:
                  raise ValueError(f"Unexpected bundle files: {names ^ expected}")
              with ZipFile(io.BytesIO(archive.read(entry["downloadURL"]))) as pkg:
                  info = json.loads(pkg.read("Payload/source.json"))["info"]
                  if info["id"] != entry["id"] or info["version"] != entry["version"]:
                      raise ValueError("Version mismatch between list and package")

              for name in sorted(expected):
                  target = Path(name)
                  if target.is_absolute() or ".." in target.parts:
                      raise ValueError("Unsafe ZIP entry path")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print(f"Published Com-X v{entry['version']}")
          PY
      - name: Commit public index and binaries
        run: |
          if [ ! -f index.min.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.min.json index.json icons/ sources/
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish Com-X source-list update"
          git push
